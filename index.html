<script>
try {
const{useState,useMemo}=React;/* ————————————————————————————————————————————————
   THE SATELLITE PLAYBOOK · VERSION 2
   FontAwesome-search-style interface:
   — left rail: Step-1 questions as filter groups
   — centre: satellite tile grid
   — click a tile: detail modal with specs, access, guidance
   Same decision logic and content as v1.
   ———————————————————————————————————————————————— */const css=`
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --ink:#0B0E1A; --panel:#131931; --panel-2:#0F1426; --line:#243052;
  --text:#E9ECF6; --muted:#93A9C4; --faint:#5E6C8F;
  --plume-a:#FF5C8A; --plume-b:#FFB454; --track:#6FA1FF; --good:#5BE3B0;
}
*{box-sizing:border-box;margin:0;padding:0}
.v2-root{min-height:100vh;background:var(--ink);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;font-size:14.5px;line-height:1.55;
  background-image:radial-gradient(1100px 500px at 90% -10%, rgba(111,161,255,.06), transparent 60%);}
.mono{font-family:'IBM Plex Mono',monospace}
.disp{font-family:'Space Grotesk',sans-serif}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,14,26,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;
  padding:14px 24px;}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;white-space:nowrap}
.brand em{color:var(--plume-a);font-style:normal}
.brand .v{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);
  letter-spacing:.14em;margin-left:8px}
.cta-wrap{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:14px;min-width:0}
.cta-txt{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.cta-txt b{color:var(--text)}
a.cta{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  background:linear-gradient(100deg,var(--plume-a),var(--plume-b));color:#1A0A12;
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;
  border-radius:10px;padding:10px 18px;text-decoration:none;transition:filter .15s}
a.cta:hover{filter:brightness(1.08)}
@keyframes ctapulse{0%,100%{box-shadow:0 0 0 0 rgba(255,92,138,.5)}50%{box-shadow:0 0 0 9px rgba(255,92,138,0)}}
a.cta.pulse{animation:ctapulse 1.4s ease-in-out infinite}
@media(max-width:640px){.cta-txt{display:none}}

/* layout */
.shell{max-width:1380px;margin:0 auto;display:flex;align-items:flex-start;gap:0}
.filters{width:264px;flex-shrink:0;padding:22px 18px 60px 24px;
  position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;}
.results{flex:1;min-width:0;padding:16px 24px 24px;border-left:1px solid var(--line);
  min-height:calc(100vh - 61px)}

/* filter groups */
.fgroup{margin-bottom:22px}
.fgroup.disabled{opacity:.35;pointer-events:none}
.fgroup h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--plume-b);margin-bottom:10px;display:flex;
  align-items:center;gap:8px}
.fgroup h4 .ln{flex:1;height:1px;background:var(--line)}
.fopt{display:flex;gap:10px;align-items:flex-start;padding:6px 6px;border-radius:8px;
  cursor:pointer;transition:background .12s}
.fopt:hover{background:var(--panel-2)}
.fopt .radio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);
  flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;
  transition:all .15s}
.fopt.on .radio{border-color:var(--plume-a)}
.fopt.on .radio::after{content:"";width:7px;height:7px;border-radius:50%;
  background:linear-gradient(120deg,var(--plume-a),var(--plume-b))}
.fopt .lb{font-size:13px;color:var(--muted)}
.fopt.on .lb{color:var(--text)}
.fclear{background:none;border:none;color:var(--track);font-size:12.5px;cursor:pointer;
  font-family:'Inter',sans-serif;padding:4px 6px}
.fclear:hover{text-decoration:underline}
.fnote{font-size:11.5px;color:var(--faint);padding:2px 6px 0;line-height:1.5}
.fselect{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 10px;outline:none;cursor:pointer}
.fselect:focus{border-color:var(--track)}
.cmp{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;margin:4px 0 18px}
.cmp h3{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600}
.cmp .cy{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--faint)}
.cmp-key{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;align-items:baseline;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.cmp-key .fn{font-size:13px;font-weight:700;color:var(--track);margin-right:3px}
.cmp-trend{margin-top:6px;font-size:11px;color:var(--faint)}
.cmp .ratio{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-top:10px}
.cmp .exp{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.cmp .exp-k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  color:var(--plume-b);text-transform:uppercase;margin-bottom:6px}
.cmp .exp p{font-size:13px;color:var(--muted);line-height:1.55;max-width:72ch}
.cmp .exp p b{color:var(--text)}
.relsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;margin:0 0 18px}
.relsec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:0}
.relsec-toggle{width:100%;background:none;border:none;padding:0;cursor:pointer;text-align:left;color:inherit;align-items:center}
.relsec-toggle:hover h3{color:var(--text)}
.rel-chev{margin-left:auto;color:var(--faint);font-size:13px;transition:transform .18s ease;transform:rotate(0deg)}
.rel-chev.up{transform:rotate(180deg)}
.rel-body{margin-top:12px}
.relsec-head h3{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600}
.rel-k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  color:var(--plume-b);text-transform:uppercase;margin:4px 0 7px}
.rel-i{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:8px;max-width:78ch}
.rel-g{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;color:var(--track)}
.cmp .src{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.5}

/* result header + banners */
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.rhead h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600}
.rcount{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:.08em}
.rsub{font-size:13px;color:var(--muted);max-width:70ch;margin-bottom:14px}
.rsub b{color:var(--text)}
.banner{padding:9px 13px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;background:linear-gradient(120deg,rgba(255,92,138,.10),rgba(255,180,84,.07));
  border:1px solid rgba(255,92,138,.3);border-radius:10px;padding:11px 14px;margin-bottom:12px;
  font-size:13px;color:var(--muted)}
.banner b{color:var(--text)}
.banner .ic{color:var(--plume-b);flex-shrink:0;margin-top:1px}

/* tile grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:14px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:20px 14px 15px;cursor:pointer;text-align:center;transition:border-color .15s, transform .15s;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.tile:hover{border-color:var(--track);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid var(--track);outline-offset:2px}
.tile .glyph{width:58px;height:58px;display:flex;align-items:center;justify-content:center}
.tile .nm{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;line-height:1.25}
.tile .rl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  color:var(--faint);text-transform:uppercase}
.tile .badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.05em;
  padding:2.5px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.pill.open{border-color:rgba(91,227,176,.4);color:var(--good)}
.pill.commercial{border-color:rgba(255,180,84,.4);color:var(--plume-b)}
.pill.ondemand{border-color:rgba(111,161,255,.45);color:var(--track)}
.pill.first{border-color:rgba(255,92,138,.55);color:var(--plume-a);font-weight:600}
.pill.warn{border-color:rgba(255,180,84,.6);color:var(--plume-b)}
.tile.dim{opacity:.45}
.tile.blurred{opacity:.35;filter:blur(2px) grayscale(.6)}
.tile.blurred:hover{opacity:.85;filter:none}
.empty{padding:60px 20px;text-align:center;color:var(--faint)}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(5,7,15,.72);backdrop-filter:blur(4px);
  z-index:60;display:flex;align-items:center;justify-content:center;padding:22px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:min(760px,100%);max-height:88vh;overflow:auto;padding:28px 30px;position:relative}
.modal .x{position:absolute;top:14px;right:14px;background:var(--panel-2);border:1px solid var(--line);
  color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px}
.modal .x:hover{color:var(--text);border-color:var(--track)}
.mhead{display:flex;gap:20px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.mhead .glyph{width:72px;height:72px;flex-shrink:0;background:var(--panel-2);
  border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center}
.mhead h3{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
.mhead .ag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);margin-top:2px}
.mspec{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13.5px;
  margin:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
.mspec dt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);
  letter-spacing:.06em;padding-top:2px}
.mspec dd{color:var(--muted)}
.mspec dd b{color:var(--text)}
.mnote{color:var(--muted);font-size:14px;max-width:64ch}
.mnote b{color:var(--text)}
.mport{margin-top:16px}
.mport h5{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;
  color:var(--plume-b);margin-bottom:8px;text-transform:uppercase}
a.lnk{color:var(--track);text-decoration:none;border-bottom:1px solid rgba(111,161,255,.35)}
a.lnk:hover{border-bottom-color:var(--track)}
.mwarn{margin-top:14px;font-size:13px;color:var(--plume-b);display:flex;gap:8px;align-items:flex-start}

/* mobile */
.fab{display:none}
@media(max-width:840px){
  .filters{position:fixed;left:0;top:61px;bottom:0;background:var(--ink);z-index:50;
    transform:translateX(-100%);transition:transform .2s;width:280px;height:auto;
    border-right:1px solid var(--line)}
  .filters.open{transform:none}
  .results{border-left:none;padding:18px 16px 90px}
  .fab{display:flex;position:fixed;bottom:18px;right:18px;z-index:55;align-items:center;gap:8px;
    background:linear-gradient(100deg,var(--plume-a),var(--plume-b));color:#1A0A12;
    border:none;border-radius:24px;padding:12px 20px;font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.5)}
}
/* workflow section */
.wf{max-width:840px;margin:0 auto;padding:30px 24px 90px}
.wf-back{background:none;border:none;color:var(--track);cursor:pointer;font-size:13px;
  font-family:'Inter',sans-serif;padding:0;margin-bottom:18px}
.wf-back:hover{text-decoration:underline}
.wf-chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 22px}
.nextcard{margin-top:14px;background:linear-gradient(120deg,rgba(255,92,138,.10),rgba(255,180,84,.07));
  border:1px solid rgba(255,92,138,.32);border-radius:14px;padding:14px 20px;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:space-between}
.nextcard .tx{max-width:56ch}
.nextcard h3{font-size:16px;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin-bottom:5px}
.nextcard p{font-size:12.5px;line-height:1.5;font-size:13.5px;color:var(--muted)}
.nextbtns{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}
.nextbtn.alt{background:var(--panel-2);color:var(--good);border:1px solid rgba(91,227,176,.45)}
.nextbtn.alt:hover{border-color:var(--good);filter:none;background:rgba(91,227,176,.08)}
.nextbtn{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  background:linear-gradient(100deg,var(--plume-a),var(--plume-b));color:#1A0A12;
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;
  border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:filter .15s}
.nextbtn:hover{filter:brightness(1.08)}
.wf-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.wf-head h2{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600}
.wf-sub{font-size:13px;color:var(--muted);max-width:70ch;margin-bottom:16px}
.wf-sub b{color:var(--text)}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  margin-bottom:10px;overflow:hidden}
.acc-sum{cursor:pointer;padding:15px 20px;display:flex;gap:13px;align-items:center;
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;background:none;
  border:none;color:var(--text);width:100%;text-align:left}
.acc-sum .stepn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  color:#1A0A12;background:linear-gradient(100deg,var(--plume-a),var(--plume-b));
  border-radius:6px;padding:3px 8px;flex-shrink:0}
.acc-sum .chev{margin-left:auto;color:var(--faint);font-family:'IBM Plex Mono',monospace;
  transition:transform .18s}
.acc.open .acc-sum .chev{transform:rotate(90deg)}
.acc-body{padding:2px 20px 18px;border-top:1px solid var(--line)}
.acc-body p{color:var(--muted);font-size:13.5px;margin:10px 0;max-width:70ch}
.acc-body p b{color:var(--text)}
.acc-body ul{margin:8px 0 8px 18px;color:var(--muted);font-size:13.5px}
.acc-body li{margin-bottom:6px;max-width:68ch}
.acc-body li b{color:var(--text)}
.acc-body h6{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;
  color:var(--plume-b);margin:14px 0 6px;text-transform:uppercase}
.check{display:flex;gap:11px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:none}
.check .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--faint);
  flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#1A0A12;transition:all .15s}
.check.on .box{background:var(--good);border-color:var(--good)}
.check .t{color:var(--muted);font-size:13.5px}
.check.on .t{color:var(--text)}
.subpanel{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  margin:10px 0 10px 28px;padding:12px 16px}
.subpanel ul{margin:0 0 0 16px;font-size:13px}
.case{border-left:3px solid var(--plume-a);padding:2px 0 2px 16px;margin:0 0 16px}
.case .who{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--plume-b);
  letter-spacing:.08em;margin-bottom:3px}
.case p{font-size:13.5px;color:var(--muted);max-width:68ch}
.case p b{color:var(--text)}
.wf-cta{margin-top:6px;font-size:13px;color:var(--faint)}
.jump{background:none;border:none;color:var(--track);cursor:pointer;font-size:12.5px;
  font-family:'Inter',sans-serif;padding:0}
.jump:hover{text-decoration:underline}
/* region map (explore centre) */
.rmap{margin-bottom:10px}
.rmap-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.rmap-head h2{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600}
.rmap-wrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rmap-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  margin-top:5px;font-size:11px;color:var(--faint)}
.rmap-dot i{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--good);margin-right:6px}
.rmap-cancel{background:none;border:none;color:var(--track);cursor:pointer;font-size:11.5px;padding:0}
.rmap-cancel:hover{text-decoration:underline}
.rmap.picking .rmap-wrap{border-color:var(--good);box-shadow:0 0 0 1px rgba(91,227,176,.25)}
.rmap-case:hover circle{stroke:#E9ECF6}
.rmap-dot b{color:var(--muted)}
.hl-wrap{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;font-size:9.5px}


/* satellite region view */
.srm{position:relative;width:100%;height:46vh;min-height:300px;overflow:hidden;
  background:#0A0E1C;touch-action:none;cursor:grab}
.srm:active{cursor:grabbing}
.srm-tile{position:absolute;user-select:none;pointer-events:none}
.srm-chip{position:absolute;transform:translate(-50%,-50%);width:58px;height:46px;
  background:rgba(11,14,26,.55);border:1.5px solid #5BE3B0;border-radius:9px;padding:2px;
  cursor:pointer;transition:transform .15s,border-color .15s;backdrop-filter:blur(2px)}
.srm-chip:hover{transform:translate(-50%,-50%) scale(1.35);border-color:#E9ECF6;z-index:5}
.srm-chip.picking{box-shadow:0 0 0 3px rgba(91,227,176,.35);animation:none}
.srm-chip img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.srm-chip span{position:absolute;bottom:-7px;right:-7px;font-size:13px;color:#FFFFFF;font-weight:700;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.srm-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
.srm-zoom button{width:30px;height:30px;border-radius:8px;background:rgba(19,25,49,.92);
  border:1px solid var(--line);color:var(--text);font-size:16px;cursor:pointer}
.srm-credit{position:absolute;right:8px;bottom:6px;font-size:9.5px;color:rgba(233,236,246,.75);
  text-shadow:0 1px 2px rgba(0,0,0,.9);pointer-events:none}

/* right mission rail */
.mrail{width:305px;flex-shrink:0;padding:16px 22px 24px 18px;border-left:1px solid var(--line);
  position:sticky;top:0;max-height:100vh;overflow:auto}
.mrail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.mrail-head .disp{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px}
.mrail-sub{font-size:11.5px;color:var(--faint);margin-bottom:12px;line-height:1.5}
.mrail-sub b{color:var(--muted)}
.mcards{display:flex;flex-direction:column;gap:7px}
.mcard{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:8px 10px;cursor:pointer;transition:border-color .15s,opacity .25s,filter .25s}
.mcard:hover{border-color:var(--track)}
.mcard.blurred{opacity:.35;filter:blur(1.5px) grayscale(.6)}
.mcard.blurred:hover{opacity:.9;filter:none}
.mc-glyph{flex-shrink:0;width:26px;display:flex;justify-content:center}
.mc-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.mc-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-role{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-pills{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.mc-pills .pill{font-size:8px;padding:2px 6px}
@media(max-width:1100px){
  .mrail{width:100%;border-left:none;border-top:1px solid var(--line);position:static;max-height:none}
  .shell{flex-wrap:wrap}
  .mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
}

/* hero map */
.hero{max-width:1240px;margin:14px auto 8px;padding:0 22px}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  flex-wrap:wrap;margin-bottom:10px}
.hero-head h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,4vw,38px);
  font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--text) 40%,var(--track));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero-sub{color:var(--muted);font-size:14.5px;margin-top:6px;max-width:52ch}
.hero-stat{display:flex;align-items:baseline;gap:12px;max-width:420px;
  border-left:2px solid var(--plume-b);padding-left:14px}
.hero-stat .hs-v{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;
  background:linear-gradient(100deg,var(--plume-a),var(--plume-b));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero-stat .hs-l{font-size:12px;color:var(--muted);line-height:1.5}
.hero-mapwrap{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:14px 14px 10px;overflow:hidden}
.hero-tip{position:absolute;transform:translate(-50%,calc(-100% - 12px));pointer-events:none;
  background:rgba(19,25,49,.97);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:12px;color:var(--muted);line-height:1.5;white-space:nowrap;z-index:5;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hero-tip b{color:var(--text);font-family:'Space Grotesk',sans-serif}
.hero-tip .ht-p{color:var(--faint);font-size:11px}
.hero-legend{display:flex;align-items:center;gap:8px;margin-top:8px;padding:0 4px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint)}
.hl-bar{width:130px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,rgb(51,67,107),rgb(111,161,255),rgb(255,180,84))}
.hl-t{font-family:'Inter',sans-serif;font-size:11px;margin-left:8px;line-height:1.4}
.beta-pill{display:inline-block;vertical-align:middle;margin-left:12px;padding:3px 9px;border-radius:6px;
  font-size:12px;letter-spacing:.14em;font-weight:600;color:#FFC24B;background:rgba(255,194,75,.12);
  border:1px solid rgba(255,194,75,.45);transform:translateY(-4px)}
/* intro showcase (the "video") */
.hshow{display:flex;gap:18px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:18px;align-items:stretch}
.hshow-rail{display:flex;flex-direction:column;gap:10px;width:308px;flex-shrink:0}
.hshow-obj{position:relative;text-align:left;background:var(--panel-2);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px 18px;cursor:pointer;overflow:hidden;flex:1;
  transition:border-color .2s,opacity .2s;opacity:.55}
.hshow-obj.on{opacity:1;border-color:var(--plume-b);box-shadow:0 0 0 1px rgba(255,180,84,.25)}
.hshow-obj .ho-t{display:block;font-family:'Space Grotesk',sans-serif;font-weight:600;
  font-size:16px;color:var(--text)}
