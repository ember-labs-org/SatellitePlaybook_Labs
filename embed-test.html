<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playbook embed test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f3f4f6;color:#111}
  .bar{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;
       display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
  #status{font-weight:700;padding:3px 10px;background:#eee}
  #status.ok{background:#13CE74;color:#fff}
  #status.bad{background:#E04B00;color:#fff}
  #h{font-variant-numeric:tabular-nums}
  .hint{color:#666;font-size:13px}
  iframe{width:100%;border:0;display:block}
  .wrap{max-width:1200px;margin:16px auto;background:#fff;border:1px solid #ddd}
</style>
</head>
<body>
<div class="bar">
  <span id="status">measuring…</span>
  <span>height: <b id="h">–</b></span>
  <span>width: <b id="wv">–</b></span>
  <span id="widths"></span>
</div>
<div class="bar" style="top:auto">
  <span>build: <b id="bld">–</b></span>
  <span>embed mode: <b id="emb">–</b></span>
  <span>map box: <b id="map">–</b></span>
  <span id="mapstatus" style="font-weight:700;padding:3px 10px;background:#eee">–</span>
</div>
<div class="wrap">
  <!-- Default: tests index.html sitting in the SAME folder as this file.
       To test the deployed site instead, open this page as:
       embed-test.html?src=https://YOUR-USERNAME.github.io/YOUR-REPO/ -->
  <iframe id="pb"></iframe>
  <script>
    document.getElementById("pb").src =
      new URLSearchParams(location.search).get("src") || "index.html";
  </script>
</div>
<script src="https://cdn.jsdelivr.net/npm/@iframe-resizer/parent@5.5.9"></script>
<script>
  // ?fixed=4000 -> no resizer, hard-set iframe height (mimics CMS fixed-height embeds)
  const FIXED = new URLSearchParams(location.search).get("fixed");
  if (FIXED) {
    document.getElementById("pb").style.height = parseInt(FIXED, 10) + "px";
    document.getElementById("status").textContent = "fixed-height mode (" + FIXED + "px) — judge the MAP row";
  } else {
    iframeResize({ license: "GPLv3", log: false }, "#pb");
  }
  const h = document.getElementById("h"), st = document.getElementById("status");
  const frame = document.getElementById("pb");
  let last = 0, stableFor = 0, samples = [];
  const wv=document.getElementById("wv"), wrap=document.querySelector(".wrap");
  [1200,1100,960,840,760,680,560].forEach(px=>{
    const b=document.createElement("button"); b.textContent=px;
    b.style.cssText="margin-left:4px;padding:3px 8px;cursor:pointer";
    b.onclick=()=>{wrap.style.maxWidth=px+"px"; samples=[]; stableFor=0; st.textContent="measuring…"; st.className="";};
    document.getElementById("widths").appendChild(b);
  });
  setInterval(() => {
    wv.textContent = Math.round(frame.getBoundingClientRect().width) + " px";
    const now = frame.getBoundingClientRect().height;
    h.textContent = Math.round(now) + " px";
    samples.push(now); if (samples.length > 40) samples.shift();
    if (Math.abs(now - last) < 2) stableFor++; else stableFor = 0;
    last = now;
    const grewALot = samples.length > 10 && samples[samples.length-1] - samples[0] > 400;
    if (!FIXED) {
      if (now > 4000 || grewALot) { st.textContent = "FAIL — runaway growth (vh loop)"; st.className = "bad"; }
      else if (stableFor > 12) { st.textContent = "PASS — height stable"; st.className = "ok"; }
    }
    inspect();
  }, 250);

  // same-origin deep inspection (works for local files; shows n/a for cross-origin deployed URLs)
  const bld=document.getElementById("bld"), embEl=document.getElementById("emb"),
        mapEl=document.getElementById("map"), ms=document.getElementById("mapstatus");
  function inspect(){
    let doc; try { doc = frame.contentDocument; } catch(e) { doc = null; }
    if (!doc || !doc.querySelector) { bld.textContent="n/a (cross-origin)"; return; }
    const root = doc.querySelector(".v2-root");
    if (!root) return;
    bld.textContent = root.getAttribute("data-build") || "NONE (old build!)";
    const isEmb = root.className.includes("emb");
    embEl.textContent = isEmb ? "ON" : "OFF (bug: not detected)";
    const srm = doc.querySelector(".srm");
    if (!srm) { mapEl.textContent = "no map on screen (intro page — click Enter the playbook inside the frame)"; ms.textContent="–"; ms.style.background="#eee"; ms.style.color="#111"; return; }
    const r = srm.getBoundingClientRect();
    mapEl.textContent = Math.round(r.width) + " × " + Math.round(r.height) + " px";
    const ok = isEmb && r.height >= 280 && r.height <= 560 && r.height < r.width * 1.1;
    ms.textContent = ok ? "MAP OK — bounded, landscape" : "MAP FAIL — oversized or embed mode off";
    ms.style.background = ok ? "#13CE74" : "#E04B00"; ms.style.color = "#fff";
  }
</script>
</body>
</html>
